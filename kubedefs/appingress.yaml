apiVersion: networking.k8s.io/v1
kind: Ingress 
metadata:
  name: vpro-ingress
  annotations:
      ngnix.ingress.kubernetes.io/use-regex: "true"
spec:      
  ingressClassName: ngnix
  rules:
  - host: vprofile.devinfos.in   
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
         service:
           name: vproapp-service
           port:
             number: 8080 
